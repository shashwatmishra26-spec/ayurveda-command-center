<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ayurveda Command Center — Arogyawardhak Aushdhalay</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root{
    --paper:#f7f5ef;
    --surface:#ffffff;
    --surface-sunk:#f2efe6;
    --ink:#161512;
    --ink-2:#55534c;
    --ink-muted:#8a877d;
    --border:#e6e2d6;
    --border-soft:#eeeae0;
    --brand:#1f6f5c;
    --brand-dark:#154e40;
    --brand-tint:#e7f1ed;
    --accent:#b5731f;
    --accent-tint:#f6ead6;
    --good:#0ca30c;
    --good-tint:#e6f5e2;
    --warning:#b8790b;
    --warning-tint:#fdf1da;
    --serious:#c2542c;
    --serious-tint:#fbe7dc;
    --critical:#d03b3b;
    --critical-tint:#fbe4e2;
    --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #root{height:100%;}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:#d8d3c4;border-radius:8px;}
  ::-webkit-scrollbar-thumb:hover{background:#c7c1ae;}
  .tabular{font-variant-numeric:tabular-nums;}
  .scrollbar-thin::-webkit-scrollbar{width:6px;height:6px;}
  .card{background:var(--surface);border:1px solid var(--border-soft);border-radius:14px;}
  .focus-ring:focus-visible{outline:2px solid var(--brand);outline-offset:2px;}
  @keyframes pulse-dot{0%,100%{opacity:1;}50%{opacity:.35;}}
  .pulse-dot{animation:pulse-dot 1.8s ease-in-out infinite;}
  @keyframes fade-in{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
  .fade-in{animation:fade-in .18s ease-out;}
</style>
</head>
<body>
<div id="root"></div>

<script src="./react-globals.bundle.js"></script>
<script src="./data.js"></script>
<script src="./ui.build.js"></script>
<script src="./modules1.build.js"></script>
<script src="./modules2.build.js"></script>
<script src="./modules3.build.js"></script>
<script src="./app.build.js"></script>
<script src="./fallback-utils.js"></script>
</body>
</html>
